version: 2

project_name: sub2api

builds:
  - id: sub2api
    dir: backend
    main: ./cmd/server
    binary: sub2api
    flags:
      - -tags=embed
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}
      - -X main.BuildType=release

archives: []

checksum:
  disable: true

changelog:
  disable: true

dockers:
  - id: ghcr-amd64
    goos: linux
    goarch: amd64
    image_templates:
      - 'ghcr.io/neko-cwc/sub2api:{{ .Version }}-amd64'
      - 'ghcr.io/neko-cwc/sub2api:{{ .Version }}'
    dockerfile: Dockerfile.goreleaser
    use: buildx
    extra_files:
      - deploy/docker-entrypoint.sh
      - backend/resources
    build_flag_templates:
      - '--platform=linux/amd64'
      - '--label=org.opencontainers.image.version={{ .Version }}'
      - '--label=org.opencontainers.image.revision={{ .Commit }}'
      - '--label=org.opencontainers.image.source=https://github.com/NEKO-CwC/sub2api'

docker_manifests: []

release:
  github:
    owner: NEKO-CwC
    name: sub2api
  draft: false
  prerelease: auto
  name_template: 'Sub2API {{ .Version }} (NEKO)'
  skip_upload: true
  header: |
    > NEKO maintained Sub2API build based on the corresponding upstream release.

    {{ .Env.TAG_MESSAGE }}
  footer: |
    ---

    ```bash
    docker pull ghcr.io/neko-cwc/sub2api:{{ .Version }}
    ```
